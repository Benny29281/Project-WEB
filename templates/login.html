<!doctype html>
<html lang="{{ current_language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t.login_title }} | Pacific Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f4f6fb; color: #182230; font-family: Inter, "Segoe UI", sans-serif; }
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
        .login-card { width: min(100%, 440px); border: 1px solid #e7ebf2; border-radius: 22px; background: #fff; box-shadow: 0 18px 55px rgba(26,39,68,.09); }
        .brand-logo { display: block; width: min(190px, 66%); height: auto; }
        .form-control, .form-select { border-color: #dfe5ee; border-radius: 10px; padding: .72rem .85rem; }
        .form-control:focus, .form-select:focus { border-color: #91a8f9; box-shadow: 0 0 0 .2rem rgba(49,87,213,.12); }
        .btn-primary { border-radius: 10px; background: #3157d5; border-color: #3157d5; padding: .72rem; font-weight: 650; }
        @media (max-width: 480px) { .login-card { border-radius: 17px; } .login-card .card-body { padding: 1.35rem !important; } .brand-logo { width: min(160px, 66%); } }
    </style>
</head>
<body>
    <main class="login-wrap">
        <section class="login-card card">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <img class="brand-logo" src="{{ url_for('static', filename='img/Asset 3.png') }}" alt="Indonesia Pacific Trade">
                    <form action="{{ url_for('set_language') }}" method="POST" class="m-0">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <label for="languageSelect" class="visually-hidden">{{ t.language }}</label>
                        <select id="languageSelect" name="language" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="{{ t.language }}">
                            {% for code, label in languages.items() %}<option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ label }}</option>{% endfor %}
                        </select>
                    </form>
                </div>
                <h1 class="h3 fw-bold mb-2">{{ t.login_title }}</h1>
                <p class="text-secondary mb-4">{{ t.brand_subtitle }}</p>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-danger border-0 rounded-3 p-3" role="alert">{{ t.get(messages[0], messages[0]) }}</div>
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">{{ t.username }}</label>
                        <input id="username" type="text" name="username" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">{{ t.password }}</label>
                        <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-2"></i>{{ t.login }}</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
